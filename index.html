<!doctype html>
<html lang="es" data-theme="dark" data-size="m" data-spacing="wide" data-font="lexend">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stand-up · Tech English para hispanohablantes</title>
  <meta name="description" content="Inglés para trabajar en equipos técnicos: dailies, Slack, reuniones, entrevistas e incidencias. Frases cortas, lecciones de 3 minutos y lectura fácil.">
  <meta name="theme-color" content="#0E1324">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1324'/%3E%3Cpath d='M18 22 L28 32 L18 42' stroke='%2338BDF8' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='32' y='38' width='16' height='5' rx='2' fill='%2338BDF8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <header class="top" id="top">
    <div class="wrap top-inner">
      <a class="brand" href="#/" aria-label="stand-up, inicio">
        <span class="brand-mark" aria-hidden="true">&gt;_</span>
        <span class="brand-text">stand-up</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="#/" data-nav="learn">Aprender</a>
        <a href="#/say" data-nav="say">Pronunciar</a>
        <a href="#/daily" data-nav="daily">Mi daily</a>
        <a href="#/cheats" data-nav="cheats">Chuletas</a>
      </nav>
      <div class="top-tools">
        <span class="stats mono" id="stats" aria-live="polite"></span>
        <button class="icon-btn" id="open-palette" aria-label="Paleta de comandos (Ctrl+K)" title="Comandos · Ctrl+K">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
        </button>
        <button class="icon-btn" id="open-settings" aria-label="Ajustes de lectura" title="Ajustes de lectura">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="foot" id="foot">
    <div class="wrap foot-inner">
      <span class="fortune mono"><span class="ps1">$ fortune</span> <span id="fortune"></span></span>
      <span>stand-up · por <a href="https://bendi.dev">Bendi</a> · <a href="https://github.com/serbenda/stand-up">código</a> · <a href="#/man" class="mono">man stand-up</a> · <kbd>Ctrl</kbd> <kbd>K</kbd></span>
    </div>
  </footer>

  <!-- Ajustes de lectura -->
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="settings">
      <div class="settings-head">
        <h2 id="settings-title">Ajustes de lectura</h2>
        <button class="icon-btn" value="close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <fieldset>
        <legend>Tema</legend>
        <div class="seg">
          <label class="opt"><input type="radio" name="theme" value="dark"> Azul noche</label>
          <label class="opt"><input type="radio" name="theme" value="light"> Claro</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Letra</legend>
        <div class="seg">
          <label class="opt"><input type="radio" name="font" value="lexend"> <span style="font-family:Lexend">Lexend</span></label>
          <label class="opt"><input type="radio" name="font" value="atkinson"> <span style="font-family:'Atkinson Hyperlegible'">Atkinson</span></label>
          <label class="opt"><input type="radio" name="font" value="system"> <span style="font-family:system-ui">Sistema</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Tamaño</legend>
        <div class="seg">
          <label class="opt"><input type="radio" name="size" value="s"> S</label>
          <label class="opt"><input type="radio" name="size" value="m"> M</label>
          <label class="opt"><input type="radio" name="size" value="l"> L</label>
          <label class="opt"><input type="radio" name="size" value="xl"> XL</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Espaciado</legend>
        <div class="seg">
          <label class="opt"><input type="radio" name="spacing" value="normal"> Normal</label>
          <label class="opt"><input type="radio" name="spacing" value="wide"> Amplio</label>
          <label class="opt"><input type="radio" name="spacing" value="xwide"> Muy amplio</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Voz</legend>
        <div class="seg">
          <label class="opt"><input type="radio" name="accent" value="en-GB"> Británica</label>
          <label class="opt"><input type="radio" name="accent" value="en-US"> Americana</label>
        </div>
        <label class="range">
          <span>Velocidad</span>
          <input type="range" name="rate" min="0.6" max="1.2" step="0.05">
          <output id="rate-out" class="mono"></output>
        </label>
      </fieldset>

      <fieldset>
        <legend>Ayudas</legend>
        <label class="check"><input type="checkbox" name="autoplay"> Reproducir el audio automáticamente</label>
        <label class="check"><input type="checkbox" name="highlight"> Resaltar cada palabra mientras suena</label>
        <label class="check"><input type="checkbox" name="ruler"> Regla de lectura que sigue al ratón o al dedo</label>
      </fieldset>

      <button class="btn btn-primary" value="close">Listo</button>
    </form>
  </dialog>

  <!-- Paleta de comandos -->
  <dialog id="palette" class="palette" aria-label="Paleta de comandos">
    <div class="palette-input">
      <span class="mono prompt" aria-hidden="true">❯</span>
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="Escribe un comando…" aria-controls="palette-list">
    </div>
    <ul id="palette-list" class="palette-list" role="listbox"></ul>
    <p class="palette-foot mono">↑↓ elegir · enter ejecutar · esc cerrar</p>
  </dialog>

  <div class="ruler" id="ruler" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/content.js"></script>
  <script src="js/tools-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
